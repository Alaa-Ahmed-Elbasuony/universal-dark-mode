<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media and SVG</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
  .hero-light { height: 140px; padding: 16px; margin-bottom: 12px; color: #222;
    background: #e8eefc url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10'%3E%3Crect width='10' height='10' fill='%23f4f7ff'/%3E%3C/svg%3E") center/cover; }
  .hero-dark { height: 140px; padding: 16px; margin-bottom: 12px; color: #fff;
    background: #101820 url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10'%3E%3Crect width='10' height='10' fill='%230b1d33'/%3E%3C/svg%3E") center/cover; }
  .card { background: #fff; border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; display: flex; gap: 16px; align-items: center; }
  .logo { background: #ffffff; padding: 8px; border: 1px solid #ccc; }
  .site-logo { display: block; }
  img { display: block; }
</style>
</head>
<body>
  <section class="hero-light" id="hero-light"><h2 id="hl-title">Light photo banner</h2><p id="hl-text">Dark text chosen for a light image.</p></section>
  <section class="hero-dark" id="hero-dark"><h2 id="hd-title">Dark photo banner</h2><p>White text chosen for a dark image.</p></section>

  <div class="card" id="card">
    <svg id="icon" width="24" height="24" viewBox="0 0 24 24"><path id="icon-path" fill="#222222" d="M2 2h20v20H2z"/></svg>
    <svg id="stroke-icon" width="24" height="24" viewBox="0 0 24 24"><circle id="stroke-circle" cx="12" cy="12" r="9" fill="none" stroke="#333333" stroke-width="2"/></svg>
    <svg id="brand-art" width="24" height="24" viewBox="0 0 24 24"><circle id="brand-circle" cx="12" cy="12" r="10" fill="#ff6600"/></svg>
    <svg class="site-logo" id="logo" width="80" height="24" viewBox="0 0 80 24"><path id="logo-path" fill="#0b1f44" d="M0 0h80v24H0z"/></svg>
    <span>Icons and logo</span>
  </div>

  <div class="card">
    <img id="photo" width="160" height="100" alt="photo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='100'%3E%3Crect width='160' height='100' fill='%23ffd166'/%3E%3Ccircle cx='80' cy='50' r='30' fill='%23ffffff'/%3E%3C/svg%3E">
    <img id="small-icon" width="24" height="24" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Crect width='24' height='24' fill='%2306d6a0'/%3E%3C/svg%3E">
    <img id="brand-img" class="logo" width="100" height="40" alt="Acme logo" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='40'%3E%3Crect width='100' height='40' fill='none'/%3E%3Ctext x='5' y='28' font-size='24' fill='%23111111'%3EAcme%3C/text%3E%3C/svg%3E">
  </div>
</body>
</html>
