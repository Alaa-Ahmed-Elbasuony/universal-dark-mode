<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account form</title>
<style>
  body { margin: 0; padding: 24px; background: #f4f5f7; font: 15px/1.5 system-ui, sans-serif; color: #172b4d; }
  form { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #dfe1e6; border-radius: 8px; padding: 24px; }
  fieldset { border: 1px solid #c1c7d0; border-radius: 6px; margin: 0 0 16px; padding: 12px 16px; }
  legend { padding: 0 6px; color: #5e6c84; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input[type=text], input[type=email], input[type=password], input[type=date], textarea, select {
    width: 100%; padding: 8px 10px; border: 1px solid #b3bac5; border-radius: 4px; background: #fafbfc; color: #172b4d; font: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: #4c9aff; background: #fff; outline: 2px solid #4c9aff55; }
  input:disabled { background: #f4f5f7; color: #a5adba; border-color: #dfe1e6; }
  .err input { border-color: #de350b; background: #ffebe6; }
  .err-msg { color: #bf2600; font-size: 13px; margin-top: 4px; }
  .help { color: #6b778c; font-size: 13px; }
  .row { display: flex; gap: 16px; align-items: center; }
  .btn { border: 0; border-radius: 4px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .primary { background: #0052cc; color: #fff; }
  .primary:hover { background: #0747a6; }
  .secondary { background: #ebecf0; color: #42526e; }
  .secondary:hover { background: #dfe1e6; }
  .btn:disabled { background: #f4f5f7; color: #a5adba; cursor: not-allowed; }
  .toggle { position: relative; width: 44px; height: 24px; background: #c1c7d0; border-radius: 12px; display: inline-block; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; }
  .toggle.on { background: #36b37e; }
  .toggle.on::after { left: 22px; }
  .chip { background: #deebff; color: #0747a6; border-radius: 3px; padding: 2px 8px; font-size: 12px; }
</style>
</head>
<body>
<form id="form" onsubmit="return false">
  <h2 style="margin-top:0">Create account</h2>
  <fieldset><legend>Profile</legend>
    <label for="name">Full name</label><input id="name" type="text" value="Ada Lovelace">
    <div class="err"><label for="email">Email</label><input id="email" type="email" value="ada@"><div class="err-msg" id="err">Enter a valid email address.</div></div>
    <label for="pw">Password</label><input id="pw" type="password" value="secret"><div class="help">At least 8 characters.</div>
    <label for="dob">Birthday</label><input id="dob" type="date">
  </fieldset>
  <fieldset><legend>Preferences</legend>
    <label for="country">Country</label><select id="country"><option>Egypt</option><option>Germany</option></select>
    <label for="bio">About you</label><textarea id="bio" rows="3" placeholder="Tell us something"></textarea>
    <div class="row" style="margin-top:12px"><label style="margin:0"><input type="checkbox" checked> Newsletter</label><label style="margin:0"><input type="radio" name="p" checked> Email</label><label style="margin:0"><input type="radio" name="p"> SMS</label><span class="toggle on" role="img" aria-label="enabled"></span></div>
    <p style="margin:12px 0 0"><span class="chip">beta</span> <input id="locked" type="text" value="Read only value" disabled></p>
  </fieldset>
  <div class="row"><button class="btn primary" id="submit">Create account</button><button class="btn secondary">Cancel</button><button class="btn" disabled>Disabled</button></div>
</form>
</body>
</html>
