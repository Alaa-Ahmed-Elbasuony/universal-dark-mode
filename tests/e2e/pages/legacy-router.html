<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Legacy router UI</title>
<style>
  body { margin: 0; text-align: center; background: #f2f2f2; font: 12px Arial, sans-serif; color: #313131; }
  /* white page column painted with a flat light image, like site_holder.gif */
  #column { width: 620px; margin: 0 auto; padding: 10px 20px 20px; text-align: left;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='2'><rect width='700' height='2' fill='%23ffffff'/><rect width='4' height='2' fill='%23d9d9d9'/><rect x='696' width='4' height='2' fill='%23d9d9d9'/></svg>") repeat-y center top; }
  #card { width: 300px; margin: 20px auto; border: 1px solid #ccc; background: #f5f5f5; }
  #title { margin: 0; padding: 12px; color: #bbb; font-size: 11px; text-align: center; height: 20px;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='2' height='40'><defs><linearGradient id='g' x2='0' y2='1'><stop offset='0' stop-color='%23f4f4f4'/><stop offset='1' stop-color='%23dcdcdc'/></linearGradient></defs><rect width='2' height='40' fill='url(%23g)'/></svg>") no-repeat; }
  .body { padding: 14px; }
  #photo { height: 120px; margin-top: 10px; color: #fff;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='120'><rect width='300' height='120' fill='%23d8c8a8'/><circle cx='80' cy='60' r='40' fill='%23a06030'/><rect x='150' width='150' height='120' fill='%23336699'/></svg>") no-repeat; }
  #sprite { display: inline-block; width: 16px; height: 16px;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><rect width='16' height='16' fill='%23336699'/></svg>"); }
</style>
</head>
<body>
<div id="column">
  <div id="card"><div id="title">Welcome to H188A. Please login.</div><div class="body">Username <input type="text"></div></div>
  <div id="photo">Banner over a picture</div>
  <p id="note">Icon: <span id="sprite"></span></p>
</div>
</body>
</html>
