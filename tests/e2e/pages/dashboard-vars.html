<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Work items (variable-driven design system)</title>
<style>
  /* Channel-triplet palette, the pattern used by Azure DevOps style design systems. */
  :root {
    --palette-neutral-0: 255, 255, 255;
    --palette-neutral-4: 248, 248, 248;
    --palette-neutral-8: 234, 234, 234;
    --palette-neutral-20: 200, 200, 200;
    --text-primary: 0, 0, 0;
    --text-secondary: 90, 90, 90;
    --link: 0, 90, 158;
    --toolbar-bg: #f4f4f4;
    --border-subtle: rgba(var(--palette-neutral-20), 1);
  }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 'Segoe UI', system-ui, sans-serif; background: rgba(var(--palette-neutral-0), 1); color: rgba(var(--text-primary), .9); }
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav { background: rgba(var(--palette-neutral-8), 1); border-right: 1px solid var(--border-subtle); padding: 12px 0; }
  nav a { display: block; padding: 8px 16px; color: rgba(var(--text-primary), .9); text-decoration: none; }
  nav a.active { background: rgba(var(--palette-neutral-20), .6); font-weight: 600; }
  nav a:hover { background: rgba(var(--palette-neutral-0), 1); }
  main { padding: 16px 20px; }
  h1 { font-weight: 300; margin: 0 0 12px; color: rgba(var(--text-secondary), 1); }
  .toolbar { background: var(--toolbar-bg); border: 1px solid var(--border-subtle); padding: 8px 12px; display: flex; gap: 16px; }
  .toolbar span { color: rgba(var(--link), 1); }
  .filter { background: rgba(var(--palette-neutral-4), 1); border: 1px solid rgba(var(--palette-neutral-8), 1); margin: 8px 0; padding: 8px; }
  .filter input { width: 70%; background: rgba(var(--palette-neutral-0), 1); border: 1px solid var(--border-subtle); padding: 6px; color: rgba(var(--text-primary), .9); }
  table { width: 100%; border-collapse: collapse; background: rgba(var(--palette-neutral-0), 1); }
  th { background: rgba(var(--palette-neutral-4), 1); text-align: left; color: rgba(var(--text-secondary), 1); border-bottom: 1px solid rgba(var(--palette-neutral-8), 1); padding: 6px 8px; }
  td { padding: 8px; border-bottom: 1px solid rgba(var(--palette-neutral-8), 1); }
  tbody tr:hover { background: rgba(var(--palette-neutral-4), 1); }
  tbody tr:hover td { background-color: rgb(238, 244, 252); }
  td a { color: rgba(var(--link), 1); }
  /* Variable defined on a deeper scope: unresolvable from the root. */
  .scoped { --scoped-bg: #ffffff; --scoped-fg: #1b1b1b; }
  .scoped .box { background: var(--scoped-bg); color: var(--scoped-fg); border: 1px solid #ccc; padding: 10px; margin-top: 12px; }
  .tag { background: rgba(var(--palette-neutral-8), 1); border-radius: 10px; padding: 1px 8px; color: rgba(var(--text-primary), .9); }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="Primary">
    <a href="#o">Overview</a>
    <a href="#b" class="active">Boards</a>
    <a href="#w">Work items</a>
    <a href="#r">Repos</a>
    <a href="#p">Pipelines</a>
  </nav>
  <main>
    <h1>Work items</h1>
    <div class="toolbar"><strong>Recently updated</strong><span>New Work Item</span><span>Column Options</span></div>
    <div class="filter"><input id="kw" placeholder="Filter by keyword"> <span class="tag">@Me (+2)</span></div>
    <table id="grid">
      <thead><tr><th>ID</th><th>Title</th><th>State</th></tr></thead>
      <tbody>
        <tr id="r1"><td>36175</td><td><a href="#1">Packages &amp; Subscriptions: adding new rules</a></td><td>Approved</td></tr>
        <tr id="r2"><td>36270</td><td><a href="#2">Social Marketing: completed campaigns</a></td><td>New</td></tr>
      </tbody>
    </table>
    <div class="scoped"><div class="box" id="scoped">Colors from a scoped variable.</div></div>
    <div id="js-styled">Styled by script after load.</div>
  </main>
</div>
<script>
  const el = document.getElementById('js-styled');
  el.style.setProperty('background', 'rgb(250, 250, 250)');
  el.style.setProperty('color', 'rgb(40, 40, 40)');
  el.style.padding = '10px';
</script>
</body>
</html>
