<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Natively dark login (glass style)</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    background-color: transparent;
    background-image: radial-gradient(1200px 600px at 20% 100%, #12425a 0%, rgba(8,20,40,0) 60%), linear-gradient(180deg, #0a1428, #060b17);
    background-attachment: fixed;
    color: #ffffff;
    font: 16px/1.5 system-ui, sans-serif;
  }
  .card { max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 34px; margin: 0 0 6px; }
  p.sub { color: rgba(255,255,255,.7); margin: 0 0 24px; }
  label { display: block; margin: 16px 0 6px; color: rgba(255,255,255,.85); }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 12px 14px; color: #fff;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 12px;
  }
  input::placeholder { color: rgba(255,255,255,.45); }
  input:focus { outline: none; border-color: rgba(120,200,255,.8); background: rgba(255,255,255,.1); }
  .remember { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .box { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.05); display: inline-block; }
  .btn-primary { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 12px; color: #fff; font-weight: 700;
    background: linear-gradient(90deg, #1c7ed6, #15aabf); }
  .btn-muted { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 12px; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, #3a9fbf, #2a7f9f); }
  .btn-disabled { width: 100%; margin-top: 18px; padding: 12px; border-radius: 12px; font-weight: 700;
    color: rgba(255,255,255,.5); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); }
  .socials { display: flex; gap: 10px; margin-top: 18px; }
  .social { flex: 1; padding: 10px; border-radius: 12px; color: #fff; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  .social:hover { background: rgba(255,255,255,.12); }
  .lang { display: inline-flex; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 3px; background: rgba(255,255,255,.04); }
  .lang button { background: transparent; color: #fff; border: 1px solid transparent; border-radius: 999px; padding: 4px 12px; }
  .lang button.on { border-color: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div class="card">
  <div class="lang"><button class="on" id="ar">العربية</button><button id="en">English</button></div>
  <h1>تسجيل دخول</h1>
  <p class="sub">سجل دخول لإدارة متجرك</p>
  <label for="user">رقم الهاتف المحمول أو البريد الإلكتروني</label>
  <input id="user" type="text" placeholder="name@example.com">
  <label for="pw">كلمة المرور</label>
  <input id="pw" type="password" value="secret">
  <div class="remember"><span class="box" id="box"></span><span>تذكرني</span></div>
  <button class="btn-disabled" id="login-disabled">تسجيل الدخول</button>
  <button class="btn-muted" id="login-muted">تسجيل الدخول</button>
  <button class="btn-primary" id="login">تسجيل الدخول</button>
  <div class="socials"><button class="social" id="g">جوجل</button><button class="social" id="f">فيسبوك</button><button class="social" id="a">أبل</button></div>
</div>
</body>
</html>
